[package]
name = "spider-ui"
version = "0.1.0"
description = "Spider Charts — NSE + BSE end-of-day scanner"
authors = ["Spider Charts"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spider_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# The engine. `default-features = false` drops the egui desktop feature: this
# front end is the window, and pulling a second GUI toolkit in would double the
# build for code that never runs.
spider_charts = { path = "../..", default-features = false }
