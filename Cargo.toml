[workspace]
members = ["spider-ui/src-tauri"]

[package]
name = "spider_charts"
version = "0.1.0"
edition = "2024"

# The engine is the library; egui is only needed by the desktop binary. Keeping
# it optional means the Tauri front end does not drag a second GUI toolkit —
# and its OpenGL stack — into a build that will never open an egui window.
[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui"]

[[bin]]
name = "spider_charts"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1.0.104"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
# `glow` (OpenGL) is enabled alongside eframe's default wgpu renderer and
# selected at runtime: wgpu's adapter initialisation segfaults on this machine
# (exit 0xC0000005 before any Rust code runs), while OpenGL is universally
# available on Windows. See `Renderer::Glow` in main.rs.
eframe = { version = "0.36.1", features = ["glow"], optional = true }
egui = { version = "0.36.1", optional = true }
env_logger = "0.11.11"
flate2 = "1"
futures = "0.3.33"
open = "5.4.1"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "gzip", "http2", "charset", "system-proxy", "default-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.3"
zip = "8.6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dependencies stay optimised even in dev builds so scans/charts never feel slow.
[profile.dev.package."*"]
opt-level = 3
